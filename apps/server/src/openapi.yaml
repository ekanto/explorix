  /api/projects/{projectId}/automation/runs:
    parameters: [{ $ref: '#/components/parameters/projectId' }]
    get:
      tags: [Automation]
      summary: 'Automation run history (?framework, branch, environment, sourceId, milestoneId, status) with facets'
      responses: { '200': { description: OK } }
    post:
      tags: [Automation]
      summary: '[TESTER] Submit a run in Explorix native JSON. Use status=RUNNING to create a staged run, then append results and complete it.'
      requestBody:
        content:
          application/json:
            schema:
              allOf:
                - { $ref: '#/components/schemas/AutomationRunMeta' }
                - type: object
                  properties:
                    status: { type: string, enum: [RUNNING, COMPLETED], default: COMPLETED }
                    results: { type: array, maxItems: 20000, items: { $ref: '#/components/schemas/AutomationResult' } }
      responses:
        '201': { description: Created, content: { application/json: { schema: { type: object, properties: { run: { $ref: '#/components/schemas/AutomationRunSummary' } } } } } }
        '400': { $ref: '#/components/responses/Error' }
  /api/projects/{projectId}/automation/runs/{id}/results:
    parameters: [{ $ref: '#/components/parameters/projectId' }, { $ref: '#/components/parameters/id' }]
    post:
      tags: [Automation]
      summary: '[TESTER] Append results to a RUNNING run (e.g. one call per shard)'
      requestBody: { content: { application/json: { schema: { type: object, required: [results], properties: { results: { type: array, items: { $ref: '#/components/schemas/AutomationResult' } } } } } } }
      responses: { '200': { description: OK } }
