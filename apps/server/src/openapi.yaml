openapi: 3.0.3
info:
  title: Explorix API
  version: 1.0.0
  description: |
    REST API for Explorix, the exploratory testing and QA management platform.

    **Authentication**
    - Browser: `POST /api/auth/login` sets an httpOnly `explorix_sid` cookie. Cookie-authenticated
      state-changing requests must send the header `X-Requested-With: explorix` (CSRF protection).
    - Scripts / CI: create a personal API token (`POST /api/tokens` from the UI: *Profile → API tokens*) and send
      `Authorization: Bearer <token>`. Tokens can optionally be restricted to one project and act with the
      permissions of the user who created them. Bearer requests do not need the CSRF header.

    **Errors** use the shape `{ "error": { "code": "validation_error", "message": "...", "details": {...} } }`.
    Resources outside your projects return **404** (existence is not disclosed). Insufficient role returns **403**.

    **Project roles**: VIEWER < TESTER < LEAD < ADMIN (organization owners/admins are implicit project admins).
    The minimum role for each operation is noted in its summary.

    **Display keys**: charters `CH-n`, sessions `S-n`, findings `F-n`, issues `<PROJECTKEY>-n`, test cases `C-n`,
    requirements `REQ-n`, test runs `R-n`, automation runs `A-n`. API paths use internal ids.
servers:
  - url: /
security:
  - cookieAuth: []
  - bearerAuth: []
tags:
  - name: Auth
  - name: Projects
  - name: Charters
  - name: Sessions
    description: Exploratory session workbench (timer, notes, log, findings, review)
  - name: Findings
  - name: Issues
  - name: Requirements
  - name: Test cases
  - name: Test runs
  - name: Automation
    description: CI ingestion (native JSON, JUnit XML, Playwright JSON), history, flaky detection
  - name: Reports
  - name: Collaboration
  - name: AI
  - name: Integrations
  - name: Admin

components:
  securitySchemes:
    cookieAuth: { type: apiKey, in: cookie, name: explorix_sid }
    bearerAuth: { type: http, scheme: bearer }
  parameters:
    projectId: { name: projectId, in: path, required: true, schema: { type: string } }
    id: { name: id, in: path, required: true, schema: { type: string } }
    format: { name: format, in: query, schema: { type: string, enum: [csv, json] } }
  responses:
    Error:
      description: Error
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string, example: validation_error }
            message: { type: string }
            details: { type: object }
    Severity: { type: string, enum: [TRIVIAL, MINOR, MAJOR, CRITICAL, BLOCKER] }
    Priority: { type: string, enum: [LOW, MEDIUM, HIGH, CRITICAL] }
    SessionStatus: { type: string, enum: [DRAFT, IN_PROGRESS, PAUSED, COMPLETED, IN_REVIEW, CHANGES_REQUESTED, APPROVED, ABANDONED] }
    CharterInput:
      type: object
      required: [title, mission]
      properties:
        title: { type: string, maxLength: 200 }
        mission: { type: string, description: 'Natural language. Suggested form: "Explore <target> using <approach> to discover <risks>".' }
        target: { type: string, description: Feature or application under test }
        scope: { type: string }
        outOfScope: { type: string }
        objectives: { type: string }
        learningGoals: { type: string }
        risks: { type: string }
        assumptions: { type: string }
        testIdeas: { type: array, items: { type: string } }
        heuristics: { type: array, items: { type: string } }
        prerequisites: { type: string }
        testData: { type: string }
        environmentId: { type: string, nullable: true }
        browser: { type: string }
        os: { type: string }
        device: { type: string }
        estimatedMinutes: { type: integer }
        timeboxMinutes: { type: integer, default: 60 }
        priority: { $ref: '#/components/schemas/Priority' }
        riskLevel: { $ref: '#/components/schemas/Priority' }
        exitCriteria: { type: string }
        status: { type: string, enum: [DRAFT, READY] }
        milestoneId: { type: string, nullable: true }
        templateId: { type: string, nullable: true }
        assigneeIds: { type: array, items: { type: string } }
        tags: { type: array, items: { type: string } }
        requirementIds: { type: array, items: { type: string } }
        customFields: { type: object, additionalProperties: true }
    FindingInput:
      type: object
      required: [title, classificationId]
      properties:
        sessionId: { type: string, description: 'Session the finding was discovered in (recommended). Must be editable by the caller.' }
        charterId: { type: string }
        classificationId: { type: string, description: 'Project classification (observation, potential_defect, confirmed_defect, question, risk, follow_up, testing_note, …)' }
        title: { type: string }
        description: { type: string }
        severity: { $ref: '#/components/schemas/Severity' }
        priority: { $ref: '#/components/schemas/Priority' }
        reproSteps: { type: string }
        expected: { type: string }
        actual: { type: string }
        environment: { type: string }
        ownerId: { type: string, nullable: true }
        requirementId: { type: string, nullable: true }
        tags: { type: array, items: { type: string } }
        customFields: { type: object, additionalProperties: true }
    AutomationResult:
      type: object
      required: [name, status]
      properties:
        key: { type: string, description: 'Stable identity for history/flakiness. Defaults to "<file>::<suite>::<name>".' }
        name: { type: string }
        suite: { type: string }
        file: { type: string }
        status:
          type: string
          description: Matched against project result status keys and aliases (e.g. passed/pass/ok, failed/failure, skipped/pending, flaky). Unknown values map to "error".
          example: passed
        durationMs: { type: integer }
        message: { type: string }
        stackTrace: { type: string }
        retries: { type: integer, description: 'Retries before the final status; a pass after retries is flagged flaky.' }
        artifacts:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              url: { type: string, format: uri }
              path: { type: string }
              contentType: { type: string }
    AutomationRunMeta:
      type: object
      properties:
        name: { type: string }
        source: { type: string, description: 'Logical source (e.g. "web-e2e"). Created automatically.' }
        framework: { type: string, example: playwright }
        branch: { type: string }
        commitSha: { type: string }
        buildNumber: { type: string }
        ciProvider: { type: string, example: github-actions }
        ciUrl: { type: string, format: uri }
        environment: { type: string }
        milestoneId: { type: string }
        milestone: { type: string, description: Milestone name (alternative to milestoneId) }
        startedAt: { type: string, format: date-time }
        completedAt: { type: string, format: date-time }
        metadata: { type: object, additionalProperties: true }
    AutomationRunSummary:
      type: object
      properties:
        id: { type: string }
        key: { type: string, example: A-12 }
        status: { type: string, enum: [RUNNING, COMPLETED] }
        totalCount: { type: integer }
        passedCount: { type: integer }
        failedCount: { type: integer }
        skippedCount: { type: integer }
        passRate: { type: number, nullable: true }
        url: { type: string }

paths:
  /api/health:
    get:
      tags: [Auth]
      summary: Liveness check (public)
      security: []
      responses: { '200': { description: OK } }

  /api/auth/login:
    post:
      tags: [Auth]
      summary: Sign in (sets session cookie). Rate limited; accounts lock temporarily after repeated failures.
      security: []
      requestBody:
        content:
          application/json:
            schema: { type: object, required: [email, password], properties: { email: { type: string }, password: { type: string } } }
      responses:
        '200': { description: Signed in }
        '401': { $ref: '#/components/responses/Error' }
  /api/auth/logout:
    post: { tags: [Auth], summary: Sign out, responses: { '204': { description: Signed out } } }
  /api/auth/me:
    get: { tags: [Auth], summary: Current user, organization role and preferences, responses: { '200': { description: OK } } }
    patch: { tags: [Auth], summary: Update own name, avatar color, preferences (theme, email notifications), responses: { '200': { description: OK } } }
  /api/auth/me/password:
    post: { tags: [Auth], summary: Change own password (revokes other sessions), responses: { '204': { description: Changed } } }

  /api/tokens:
    get: { tags: [Auth], summary: List own API tokens (secrets are never returned again), responses: { '200': { description: OK } } }
    post:
      tags: [Auth]
      summary: Create an API token (interactive session only). The secret is returned once.
      requestBody:
        content:
          application/json:
            schema: { type: object, required: [name], properties: { name: { type: string }, projectId: { type: string, nullable: true }, expiresInDays: { type: integer } } }
      responses: { '201': { description: Created; response contains `secret` } }
  /api/tokens/{id}:
    delete: { tags: [Auth], summary: Revoke a token, parameters: [{ $ref: '#/components/parameters/id' }], responses: { '204': { description: Revoked } } }

  /api/users:
    get: { tags: [Collaboration], summary: Active organization users (optional ?projectId= restricts to members), responses: { '200': { description: OK } } }
  /api/my-work:
    get: { tags: [Collaboration], summary: 'Assigned charters, active/draft sessions, reviews, owned findings, assigned issues and test-run items, upcoming and overdue work', responses: { '200': { description: OK } } }
  /api/notifications:
    get: { tags: [Collaboration], summary: 'In-app notifications (?unread=true, page, pageSize)', responses: { '200': { description: OK } } }
  /api/notifications/read:
    post: { tags: [Collaboration], summary: 'Mark notifications read ({ids:[...]} or {all:true})', responses: { '200': { description: OK } } }
  /api/search:
    get: { tags: [Collaboration], summary: 'Global search across accessible projects (?q=, optional projectId). Matches titles and keys like S-12.', responses: { '200': { description: OK } } }
  /api/overview:
    get: { tags: [Reports], summary: Cross-project overview, responses: { '200': { description: OK } } }

  /api/projects:
    get: { tags: [Projects], summary: Projects the caller can access, responses: { '200': { description: OK } } }
    post: { tags: [Projects], summary: Create a project (org admins; creator becomes project admin). Seeds default classifications, statuses and folder., responses: { '201': { description: Created } } }
  /api/projects/{projectId}:
    parameters: [{ $ref: '#/components/parameters/projectId' }]
    get: { tags: [Projects], summary: 'Project with members, milestones, environments, tags, custom fields, classifications, statuses, your role', responses: { '200': { description: OK } } }
    patch: { tags: [Projects], summary: '[ADMIN] Update name, description, color and settings (requireReview, allowSelfReview, lockCompletedSessions, defaultTimeboxMinutes, allowTesterCharterEdit)', responses: { '200': { description: OK } } }
  /api/projects/{projectId}/archive:
    parameters: [{ $ref: '#/components/parameters/projectId' }]
    post: { tags: [Projects], summary: '[ADMIN] Archive (read-only)', responses: { '200': { description: OK } } }
  /api/projects/{projectId}/unarchive:
    parameters: [{ $ref: '#/components/parameters/projectId' }]
    post: { tags: [Projects], summary: '[ADMIN] Unarchive', responses: { '200': { description: OK } } }
  /api/projects/{projectId}/activity:
    parameters: [{ $ref: '#/components/parameters/projectId' }]
    get: { tags: [Projects], summary: Project audit/activity history, responses: { '200': { description: OK } } }
  /api/projects/{projectId}/members:
    parameters: [{ $ref: '#/components/parameters/projectId' }]
    post: { tags: [Projects], summary: '[ADMIN] Add member {userId, role}', responses: { '201': { description: Added } } }
  /api/projects/{projectId}/members/{memberId}:
    parameters: [{ $ref: '#/components/parameters/projectId' }, { name: memberId, in: path, required: true, schema: { type: string } }]
    patch: { tags: [Projects], summary: '[ADMIN] Change role (the last admin cannot be demoted)', responses: { '200': { description: OK } } }
    delete: { tags: [Projects], summary: '[ADMIN] Remove member', responses: { '204': { description: Removed } } }
  /api/projects/{projectId}/{collection}:
    parameters:
      - { $ref: '#/components/parameters/projectId' }
      - { name: collection, in: path, required: true, schema: { type: string, enum: [milestones, environments, tags, custom-fields, classifications, statuses] } }
    post: { tags: [Projects], summary: 'Create a configuration item (milestones/environments: LEAD; tags: LEAD; custom fields, classifications, statuses: ADMIN)', responses: { '201': { description: Created } } }
  /api/projects/{projectId}/{collection}/{itemId}:
    parameters:
      - { $ref: '#/components/parameters/projectId' }
      - { name: collection, in: path, required: true, schema: { type: string } }
      - { name: itemId, in: path, required: true, schema: { type: string } }
    patch: { tags: [Projects], summary: Update a configuration item, responses: { '200': { description: OK } } }
    delete: { tags: [Projects], summary: Delete (or archive when in use) a configuration item, responses: { '204': { description: Deleted } } }

  /api/projects/{projectId}/templates:
    parameters: [{ $ref: '#/components/parameters/projectId' }]
    get: { tags: [Charters], summary: Charter templates (system, organization and project), responses: { '200': { description: OK } } }
    post: { tags: [Charters], summary: '[LEAD] Create template', responses: { '201': { description: Created } } }
  /api/projects/{projectId}/templates/{id}:
    parameters: [{ $ref: '#/components/parameters/projectId' }, { $ref: '#/components/parameters/id' }]
    get: { tags: [Charters], summary: Template, responses: { '200': { description: OK } } }
    patch: { tags: [Charters], summary: '[LEAD] Edit template', responses: { '200': { description: OK } } }

  /api/projects/{projectId}/charters:
    parameters: [{ $ref: '#/components/parameters/projectId' }]
    get:
      tags: [Charters]
      summary: List charters
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string, enum: [DRAFT, READY, ARCHIVED, active] } }
        - { name: priority, in: query, schema: { type: string } }
        - { name: riskLevel, in: query, schema: { type: string } }
        - { name: milestoneId, in: query, schema: { type: string } }
        - { name: assigneeId, in: query, schema: { type: string, description: user id or "me" } }
        - { name: tag, in: query, schema: { type: string } }
      responses: { '200': { description: OK } }
    post:
      tags: [Charters]
      summary: '[TESTER] Create charter'
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/CharterInput' } } } }
      responses: { '201': { description: Created }, '400': { $ref: '#/components/responses/Error' } }
  /api/projects/{projectId}/charters/{id}:
    parameters: [{ $ref: '#/components/parameters/projectId' }, { $ref: '#/components/parameters/id' }]
    get: { tags: [Charters], summary: Charter with sessions, requirements and permissions, responses: { '200': { description: OK }, '404': { $ref: '#/components/responses/Error' } } }
    patch: { tags: [Charters], summary: '[TESTER/LEAD] Edit charter (audited)', requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/CharterInput' } } } }, responses: { '200': { description: OK } } }
  /api/projects/{projectId}/charters/{id}/history:
    parameters: [{ $ref: '#/components/parameters/projectId' }, { $ref: '#/components/parameters/id' }]
    get: { tags: [Charters], summary: Creation and modification history, responses: { '200': { description: OK } } }
  /api/projects/{projectId}/charters/{id}/duplicate:
    parameters: [{ $ref: '#/components/parameters/projectId' }, { $ref: '#/components/parameters/id' }]
    post: { tags: [Charters], summary: '[TESTER] Duplicate as a new draft', responses: { '201': { description: Created } } }
  /api/projects/{projectId}/charters/{id}/archive:
    parameters: [{ $ref: '#/components/parameters/projectId' }, { $ref: '#/components/parameters/id' }]
    post: { tags: [Charters], summary: '[TESTER] Archive', responses: { '200': { description: OK } } }
  /api/projects/{projectId}/charters/{id}/unarchive:
    parameters: [{ $ref: '#/components/parameters/projectId' }, { $ref: '#/components/parameters/id' }]
    post: { tags: [Charters], summary: '[TESTER] Unarchive', responses: { '200': { description: OK } } }
  /api/projects/{projectId}/charters/{id}/sessions:
    parameters: [{ $ref: '#/components/parameters/projectId' }, { $ref: '#/components/parameters/id' }]
    post:
      tags: [Charters]
      summary: '[TESTER] Launch a session from the charter. Each session keeps its own history and findings.'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string }
                testerId: { type: string, nullable: true }
                start: { type: boolean, description: Start the timer immediately }
                timeboxMinutes: { type: integer }
                milestoneId: { type: string }
                environmentId: { type: string }
                browser: { type: string }
                os: { type: string }
                device: { type: string }
                buildVersion: { type: string }
                dueDate: { type: string, format: date-time }
      responses: { '201': { description: Created } }

  /api/projects/{projectId}/sessions:
    parameters: [{ $ref: '#/components/parameters/projectId' }]
    get:
      tags: [Sessions]
      summary: Session repository
      parameters:
        - { name: view, in: query, schema: { type: string, enum: [all, active, completed, draft, assigned, review, abandoned, archived] } }
        - { name: testerId, in: query, schema: { type: string, description: 'user id, "me" or "none"' } }
        - { name: charterId, in: query, schema: { type: string } }
        - { name: milestoneId, in: query, schema: { type: string } }
        - { name: priority, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string } }
        - { name: tag, in: query, schema: { type: string } }
        - { name: from, in: query, schema: { type: string, format: date } }
        - { name: to, in: query, schema: { type: string, format: date } }
        - { name: q, in: query, schema: { type: string } }
      responses: { '200': { description: OK } }
    post: { tags: [Sessions], summary: '[TESTER] Create session ({charterId, ...launch options})', responses: { '201': { description: Created } } }
  /api/projects/{projectId}/sessions/bulk:
    parameters: [{ $ref: '#/components/parameters/projectId' }]
    post:
      tags: [Sessions]
      summary: '[LEAD] Bulk assign / tag / untag / archive / unarchive / set milestone'
      requestBody:
        content:
          application/json:
            schema: { type: object, required: [ids, action], properties: { ids: { type: array, items: { type: string } }, action: { type: string, enum: [assign, tag, untag, archive, unarchive, milestone] }, testerId: { type: string, nullable: true }, tags: { type: array, items: { type: string } }, milestoneId: { type: string, nullable: true } } }
      responses: { '200': { description: OK } }
  /api/projects/{projectId}/sessions/{id}:
    parameters: [{ $ref: '#/components/parameters/projectId' }, { $ref: '#/components/parameters/id' }]
    get: { tags: [Sessions], summary: 'Session with charter, live elapsed time, chronological log, findings, attachments, related sessions and permissions', responses: { '200': { description: OK } } }
    patch: { tags: [Sessions], summary: '[TESTER] Edit metadata (title, tester, environment, timebox, summary, TBS breakdown, tags, custom fields)', responses: { '200': { description: OK } } }
  /api/projects/{projectId}/sessions/{id}/notes:
    parameters: [{ $ref: '#/components/parameters/projectId' }, { $ref: '#/components/parameters/id' }]
    put:
      tags: [Sessions]
      summary: 'Autosave rich-text notes with optimistic concurrency (409 with the server copy when baseVersion is stale, unless force=true)'
      requestBody:
        content:
          application/json:
            schema: { type: object, required: [notes], properties: { notes: { type: string, description: Sanitized HTML }, baseVersion: { type: integer }, force: { type: boolean } } }
      responses: { '200': { description: Saved }, '409': { $ref: '#/components/responses/Error' } }
  /api/projects/{projectId}/sessions/{id}/log:
    parameters: [{ $ref: '#/components/parameters/projectId' }, { $ref: '#/components/parameters/id' }]
    post: { tags: [Sessions], summary: 'Add a timestamped note to the chronological log ({content})', responses: { '201': { description: Created } } }
  /api/projects/{projectId}/sessions/{id}/{transition}:
    parameters:
      - { $ref: '#/components/parameters/projectId' }
      - { $ref: '#/components/parameters/id' }
      - { name: transition, in: path, required: true, schema: { type: string, enum: [start, pause, resume, finish, abandon, submit-review, approve, request-changes, reopen, archive, unarchive, duplicate] } }
    post:
      tags: [Sessions]
      summary: 'Workflow transition. finish accepts {summary, setupPercent, testPercent, bugPercent, charterVsOpportunity}; when the project requires review, finish moves to IN_REVIEW. approve/request-changes [LEAD] accept {comment}.'
      responses: { '200': { description: OK }, '409': { description: Invalid transition for current status } }
  /api/projects/{projectId}/sessions/{id}/relations:
    parameters: [{ $ref: '#/components/parameters/projectId' }, { $ref: '#/components/parameters/id' }]
    post: { tags: [Sessions], summary: 'Link a related session ({relatedId, kind})', responses: { '201': { description: Linked } } }
  /api/projects/{projectId}/sessions/{id}/report:
    parameters: [{ $ref: '#/components/parameters/projectId' }, { $ref: '#/components/parameters/id' }, { $ref: '#/components/parameters/format' }]
    get: { tags: [Sessions], summary: 'Session report as Markdown (default) or JSON (?format=json)', responses: { '200': { description: OK } } }

  /api/projects/{projectId}/findings:
    parameters: [{ $ref: '#/components/parameters/projectId' }]
    get:
      tags: [Findings]
      summary: Findings repository
      parameters:
        - { name: open, in: query, schema: { type: boolean, description: New or Triaged only } }
        - { name: defects, in: query, schema: { type: boolean, description: Classifications marked as defect } }
        - { name: classification, in: query, schema: { type: string, description: 'Classification key(s), comma separated' } }
        - { name: severity, in: query, schema: { type: string } }
        - { name: status, in: query, schema: { type: string } }
        - { name: sessionId, in: query, schema: { type: string } }
        - { name: charterId, in: query, schema: { type: string } }
        - { name: q, in: query, schema: { type: string } }
      responses: { '200': { description: OK } }
    post:
      tags: [Findings]
      summary: '[TESTER] Record a finding (logged in the session timeline with elapsed time)'
      requestBody: { content: { application/json: { schema: { $ref: '#/components/schemas/FindingInput' } } } }
      responses: { '201': { description: Created } }
  /api/projects/{projectId}/findings/export:
    parameters: [{ $ref: '#/components/parameters/projectId' }, { $ref: '#/components/parameters/format' }]
    get: { tags: [Findings], summary: Export filtered findings as CSV or JSON, responses: { '200': { description: OK } } }
  /api/projects/{projectId}/findings/similar:
    parameters: [{ $ref: '#/components/parameters/projectId' }]
    post: { tags: [Findings], summary: 'Duplicate suggestions for a draft {title, description} (suggestions only; nothing is merged automatically)', responses: { '200': { description: OK } } }
  /api/projects/{projectId}/findings/{id}:
    parameters: [{ $ref: '#/components/parameters/projectId' }, { $ref: '#/components/parameters/id' }]
    get: { tags: [Findings], summary: Finding with evidence, history and links, responses: { '200': { description: OK } } }
    patch: { tags: [Findings], summary: '[TESTER] Edit / triage (status, owner, classification, ...)', responses: { '200': { description: OK } } }
  /api/projects/{projectId}/findings/{id}/convert-to-issue:
    parameters: [{ $ref: '#/components/parameters/projectId' }, { $ref: '#/components/parameters/id' }]
    post: { tags: [Findings], summary: '[TESTER] Create an internal issue from the finding (original finding and session history preserved)', responses: { '201': { description: Created } } }
  /api/projects/{projectId}/findings/{id}/link-issue:
    parameters: [{ $ref: '#/components/parameters/projectId' }, { $ref: '#/components/parameters/id' }]
    post: { tags: [Findings], summary: '[TESTER] Link to an existing issue ({issueId|null})', responses: { '200': { description: OK } } }
  /api/projects/{projectId}/findings/{id}/mark-duplicate:
    parameters: [{ $ref: '#/components/parameters/projectId' }, { $ref: '#/components/parameters/id' }]
    post: { tags: [Findings], summary: '[TESTER] Explicitly mark as duplicate of another finding ({duplicateOfId})', responses: { '200': { description: OK } } }
  /api/projects/{projectId}/findings/{id}/create-test-case:
    parameters: [{ $ref: '#/components/parameters/projectId' }, { $ref: '#/components/parameters/id' }]
    post: { tags: [Findings], summary: '[TESTER] Turn a validated finding into a regression test case', responses: { '201': { description: Created } } }

  /api/projects/{projectId}/issues:
    parameters: [{ $ref: '#/components/parameters/projectId' }]
