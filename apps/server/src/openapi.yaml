      - { name: milestone, in: query, schema: { type: string } }
    post:
      tags: [Automation]
      summary: '[TESTER] Import a JUnit XML report (Jest, pytest, Maven/Gradle, Cypress, Selenium, ...). Metadata via query string.'
      requestBody: { content: { application/xml: { schema: { type: string } } } }
      responses: { '201': { description: Created }, '400': { $ref: '#/components/responses/Error' } }
