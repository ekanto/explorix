    post:
      tags: [Automation]
      summary: '[TESTER] Import Playwright JSON reporter output (reporter: json). Same query metadata as JUnit. Retries are used for flaky detection.'
      requestBody: { content: { application/json: { schema: { type: object } } } }
      responses: { '201': { description: Created } }
